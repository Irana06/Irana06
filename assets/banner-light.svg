<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
<style>
.type{animation:type 1.2s steps(6) .4s both}
.out{animation:fade .5s 1.9s both}
.caret{animation:blink 1s steps(1) infinite}
.flow{stroke-dasharray:6 6;animation:dash 1.6s linear infinite}
@keyframes type{from{width:0}to{width:66px}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes dash{to{stroke-dashoffset:-24}}
@media (prefers-reduced-motion:reduce){.type,.out,.caret,.flow{animation:none}}
</style>
